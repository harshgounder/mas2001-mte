<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">Question mutation operators</title><desc id="desc">Difference between surface reskins and structural question mutations</desc><rect width="1200" height="720" fill="#ffffff"/><text x="60" y="58" font-family="Inter,Arial,sans-serif" font-size="34" font-weight="500" text-anchor="start" fill="#172033">Question mutation map</text><rect x="55" y="105" width="300" height="90" rx="18" fill="#2563eb18" stroke="#2563eb" stroke-width="3"/><text x="205.0" y="143" font-family="Inter,Arial,sans-serif" font-size="23" font-weight="500" text-anchor="middle" fill="#172033">Question skeleton</text><text x="205.0" y="173" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="middle" fill="#64748b">model, target, solve path</text><rect x="55" y="255" width="300" height="90" rx="18" fill="#0891b218" stroke="#0891b2" stroke-width="3"/><text x="205.0" y="293" font-family="Inter,Arial,sans-serif" font-size="23" font-weight="500" text-anchor="middle" fill="#172033">Surface details</text><text x="205.0" y="323" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="middle" fill="#64748b">numbers, names, units, story</text><text x="205" y="405" font-family="Inter,Arial,sans-serif" font-size="21" font-weight="500" text-anchor="middle" fill="#16a34a">M0 changes the surface</text><text x="205" y="438" font-family="Inter,Arial,sans-serif" font-size="19" font-weight="400" text-anchor="middle" fill="#64748b">type usually stays fixed</text><rect x="500" y="105" width="150" height="84" rx="18" fill="#7c3aed18" stroke="#7c3aed" stroke-width="3"/><text x="575.0" y="143" font-family="Inter,Arial,sans-serif" font-size="23" font-weight="500" text-anchor="middle" fill="#172033">M1</text><text x="575.0" y="173" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="middle" fill="#64748b">INVERT</text><line x1="650" y1="147" x2="705" y2="147" stroke="#dbe3ee" stroke-width="4"/><rect x="705" y="105" width="425" height="84" rx="18" fill="#ea580c18" stroke="#ea580c" stroke-width="3"/><text x="917.5" y="143" font-family="Inter,Arial,sans-serif" font-size="23" font-weight="500" text-anchor="middle" fill="#172033">swap given and asked</text><text x="917.5" y="173" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="middle" fill="#64748b">x to P becomes P to x</text><rect x="500" y="237" width="150" height="84" rx="18" fill="#7c3aed18" stroke="#7c3aed" stroke-width="3"/><text x="575.0" y="275" font-family="Inter,Arial,sans-serif" font-size="23" font-weight="500" text-anchor="middle" fill="#172033">M2</text><text x="575.0" y="305" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="middle" fill="#64748b">RE-CONDITION</text><line x1="650" y1="279" x2="705" y2="279" stroke="#dbe3ee" stroke-width="4"/><rect x="705" y="237" width="425" height="84" rx="18" fill="#ea580c18" stroke="#ea580c" stroke-width="3"/><text x="917.5" y="275" font-family="Inter,Arial,sans-serif" font-size="23" font-weight="500" text-anchor="middle" fill="#172033">change a structural condition</text><text x="917.5" y="305" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="middle" fill="#64748b">replacement, sample size</text><rect x="500" y="369" width="150" height="84" rx="18" fill="#7c3aed18" stroke="#7c3aed" stroke-width="3"/><text x="575.0" y="407" font-family="Inter,Arial,sans-serif" font-size="23" font-weight="500" text-anchor="middle" fill="#172033">M3</text><text x="575.0" y="437" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="middle" fill="#64748b">RE-TARGET</text><line x1="650" y1="411" x2="705" y2="411" stroke="#dbe3ee" stroke-width="4"/><rect x="705" y="369" width="425" height="84" rx="18" fill="#ea580c18" stroke="#ea580c" stroke-width="3"/><text x="917.5" y="407" font-family="Inter,Arial,sans-serif" font-size="23" font-weight="500" text-anchor="middle" fill="#172033">same setup, new target</text><text x="917.5" y="437" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="middle" fill="#64748b">point, tail, conditional</text><rect x="500" y="501" width="150" height="84" rx="18" fill="#7c3aed18" stroke="#7c3aed" stroke-width="3"/><text x="575.0" y="539" font-family="Inter,Arial,sans-serif" font-size="23" font-weight="500" text-anchor="middle" fill="#172033">M4</text><text x="575.0" y="569" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="middle" fill="#64748b">COMPOSE</text><line x1="650" y1="543" x2="705" y2="543" stroke="#dbe3ee" stroke-width="4"/><rect x="705" y="501" width="425" height="84" rx="18" fill="#ea580c18" stroke="#ea580c" stroke-width="3"/><text x="917.5" y="539" font-family="Inter,Arial,sans-serif" font-size="23" font-weight="500" text-anchor="middle" fill="#172033">nest two models</text><text x="917.5" y="569" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="middle" fill="#64748b">solve the inner model first</text><line x1="355" y1="150" x2="500" y2="150" stroke="#dbe3ee" stroke-width="4"/><line x1="355" y1="300" x2="430" y2="300" stroke="#dbe3ee" stroke-width="4"/><text x="600" y="675" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="500" text-anchor="middle" fill="#dc2626">source match confidence belongs to the evidence ledger, not to visual similarity alone</text></svg>
