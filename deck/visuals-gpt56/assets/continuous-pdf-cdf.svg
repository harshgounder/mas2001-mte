<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">Continuous PDF and CDF relationships</title><desc id="desc">Relationship between density, interval area, cumulative distribution, and differentiation</desc><rect width="1200" height="720" fill="#ffffff"/><text x="60" y="58" font-family="Inter,Arial,sans-serif" font-size="34" font-weight="500" text-anchor="start" fill="#172033">Continuous probability: area, accumulation, derivative</text><rect x="70" y="115" width="300" height="95" rx="18" fill="#0891b218" stroke="#0891b2" stroke-width="3"/><text x="220.0" y="153" font-family="Inter,Arial,sans-serif" font-size="23" font-weight="500" text-anchor="middle" fill="#172033">PDF f(x)</text><text x="220.0" y="183" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="middle" fill="#64748b">nonnegative; total area = 1</text><rect x="450" y="115" width="300" height="95" rx="18" fill="#16a34a18" stroke="#16a34a" stroke-width="3"/><text x="600.0" y="153" font-family="Inter,Arial,sans-serif" font-size="23" font-weight="500" text-anchor="middle" fill="#172033">Probability</text><text x="600.0" y="183" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="middle" fill="#64748b">area from a to b</text><rect x="830" y="115" width="300" height="95" rx="18" fill="#7c3aed18" stroke="#7c3aed" stroke-width="3"/><text x="980.0" y="153" font-family="Inter,Arial,sans-serif" font-size="23" font-weight="500" text-anchor="middle" fill="#172033">CDF F(x)</text><text x="980.0" y="183" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="middle" fill="#64748b">area to the left of x</text><line x1="370" y1="162" x2="450" y2="162" stroke="#dbe3ee" stroke-width="5"/><text x="410" y="145" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="500" text-anchor="middle" fill="#64748b">integrate</text><line x1="750" y1="162" x2="830" y2="162" stroke="#dbe3ee" stroke-width="5"/><text x="790" y="145" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="500" text-anchor="middle" fill="#64748b">accumulate</text><text x="600" y="285" font-family="Inter,Arial,sans-serif" font-size="25" font-weight="500" text-anchor="middle" fill="#172033">F(x) = integral from -infinity to x of f(t) dt</text><text x="600" y="330" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="500" text-anchor="middle" fill="#7c3aed">f(x) = F'(x), where an absolutely continuous F is differentiable</text><rect x="70" y="410" width="315" height="100" rx="18" fill="#2563eb18" stroke="#2563eb" stroke-width="3"/><text x="227.5" y="448" font-family="Inter,Arial,sans-serif" font-size="23" font-weight="500" text-anchor="middle" fill="#172033">Endpoints</text><text x="227.5" y="478" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="middle" fill="#64748b">P(a&lt;X&lt;b) = P(a≤X≤b)</text><rect x="442" y="410" width="315" height="100" rx="18" fill="#ea580c18" stroke="#ea580c" stroke-width="3"/><text x="599.5" y="448" font-family="Inter,Arial,sans-serif" font-size="23" font-weight="500" text-anchor="middle" fill="#172033">Support</text><text x="599.5" y="478" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="middle" fill="#64748b">clip intervals to where f is nonzero</text><rect x="815" y="410" width="315" height="100" rx="18" fill="#dc262618" stroke="#dc2626" stroke-width="3"/><text x="972.5" y="448" font-family="Inter,Arial,sans-serif" font-size="23" font-weight="500" text-anchor="middle" fill="#172033">Point mass</text><text x="972.5" y="478" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="middle" fill="#64748b">P(X=c)=0 is not impossible</text><text x="600" y="590" font-family="Inter,Arial,sans-serif" font-size="24" font-weight="500" text-anchor="middle" fill="#172033">continuous interval: F(b) - F(a)</text><text x="600" y="635" font-family="Inter,Arial,sans-serif" font-size="24" font-weight="500" text-anchor="middle" fill="#dc2626">integer-valued interval: F(b) - F(a-1)</text></svg>
