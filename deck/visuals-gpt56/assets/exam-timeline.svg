<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">Ninety-minute exam practice budget</title><desc id="desc">Proportional ninety-minute timeline for reading, three sections, and checking</desc><rect width="1200" height="720" fill="#ffffff"/><text x="60" y="58" font-family="Inter,Arial,sans-serif" font-size="34" font-weight="500" text-anchor="start" fill="#172033">Ninety-minute practice budget</text><rect x="75" y="230" width="35.0" height="120" fill="#2563eb" opacity="0.88"/><text x="92.5" y="282" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="500" text-anchor="middle" fill="#ffffff">Read</text><text x="92.5" y="315" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="500" text-anchor="middle" fill="#ffffff">3 min</text><text x="75" y="380" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="500" text-anchor="middle" fill="#172033">0</text><rect x="110.0" y="230" width="233.33333333333334" height="120" fill="#0891b2" opacity="0.88"/><text x="226.66666666666669" y="282" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="500" text-anchor="middle" fill="#ffffff">Section A</text><text x="226.66666666666669" y="315" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="500" text-anchor="middle" fill="#ffffff">20 min</text><text x="110.0" y="380" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="500" text-anchor="middle" fill="#172033">3</text><rect x="343.33333333333337" y="230" width="408.3333333333333" height="120" fill="#16a34a" opacity="0.88"/><text x="547.5" y="282" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="500" text-anchor="middle" fill="#ffffff">Section B</text><text x="547.5" y="315" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="500" text-anchor="middle" fill="#ffffff">35 min</text><text x="343.33333333333337" y="380" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="500" text-anchor="middle" fill="#172033">23</text><rect x="751.6666666666667" y="230" width="291.6666666666667" height="120" fill="#ea580c" opacity="0.88"/><text x="897.5000000000001" y="282" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="500" text-anchor="middle" fill="#ffffff">Section C</text><text x="897.5000000000001" y="315" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="500" text-anchor="middle" fill="#ffffff">25 min</text><text x="751.6666666666667" y="380" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="500" text-anchor="middle" fill="#172033">58</text><rect x="1043.3333333333335" y="230" width="81.66666666666667" height="120" fill="#7c3aed" opacity="0.88"/><text x="1084.1666666666667" y="282" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="500" text-anchor="middle" fill="#ffffff">Check</text><text x="1084.1666666666667" y="315" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="500" text-anchor="middle" fill="#ffffff">7 min</text><text x="1043.3333333333335" y="380" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="500" text-anchor="middle" fill="#172033">83</text><text x="1125" y="380" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="500" text-anchor="middle" fill="#172033">90</text><text x="600" y="430" font-family="Inter,Arial,sans-serif" font-size="25" font-weight="500" text-anchor="middle" fill="#172033">3 + 20 + 35 + 25 + 7 = 90 minutes</text><rect x="155" y="510" width="380" height="90" rx="18" fill="#ea580c18" stroke="#ea580c" stroke-width="3"/><text x="345.0" y="548" font-family="Inter,Arial,sans-serif" font-size="23" font-weight="500" text-anchor="middle" fill="#172033">Section C is an 8-mark block</text><text x="345.0" y="578" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="middle" fill="#64748b">its topic may change</text><rect x="665" y="510" width="380" height="90" rx="18" fill="#7c3aed18" stroke="#7c3aed" stroke-width="3"/><text x="855.0" y="548" font-family="Inter,Arial,sans-serif" font-size="23" font-weight="500" text-anchor="middle" fill="#172033">Leave seven minutes to check</text><text x="855.0" y="578" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="middle" fill="#64748b">boundaries, units, missed parts</text></svg>
