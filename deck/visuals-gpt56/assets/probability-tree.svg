<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">Conditional probability tree</title><desc id="desc">Two-stage probability tree with multiplication along branches</desc><rect width="1200" height="720" fill="#ffffff"/><text x="60" y="60" font-family="Inter,Arial,sans-serif" font-size="34" font-weight="500" text-anchor="start" fill="#172033">Conditional probability tree</text><rect x="55" y="300" width="150" height="70" rx="18" fill="#2563eb18" stroke="#2563eb" stroke-width="3"/><text x="130.0" y="338" font-family="Inter,Arial,sans-serif" font-size="23" font-weight="500" text-anchor="middle" fill="#172033">Start</text><line x1="205" y1="335" x2="390" y2="220" stroke="#2563eb" stroke-width="4"/><text x="285" y="269.5" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="500" text-anchor="middle" fill="#2563eb">P(A)</text><rect x="390" y="190" width="170" height="70" rx="18" fill="#0891b218" stroke="#0891b2" stroke-width="3"/><text x="475.0" y="228" font-family="Inter,Arial,sans-serif" font-size="23" font-weight="500" text-anchor="middle" fill="#172033">A</text><line x1="205" y1="335" x2="390" y2="520" stroke="#2563eb" stroke-width="4"/><text x="285" y="419.5" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="500" text-anchor="middle" fill="#2563eb">1-P(A)</text><rect x="390" y="490" width="170" height="70" rx="18" fill="#0891b218" stroke="#0891b2" stroke-width="3"/><text x="475.0" y="528" font-family="Inter,Arial,sans-serif" font-size="23" font-weight="500" text-anchor="middle" fill="#172033">not A</text><line x1="560" y1="225" x2="770" y2="125" stroke="#0891b2" stroke-width="4"/><text x="660" y="168.0" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="500" text-anchor="middle" fill="#0891b2">P(B|A)</text><rect x="770" y="95" width="190" height="65" rx="18" fill="#16a34a18" stroke="#16a34a" stroke-width="3"/><text x="865.0" y="133" font-family="Inter,Arial,sans-serif" font-size="23" font-weight="500" text-anchor="middle" fill="#172033">B</text><line x1="560" y1="225" x2="770" y2="305" stroke="#0891b2" stroke-width="4"/><text x="660" y="258.0" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="500" text-anchor="middle" fill="#0891b2">1-P(B|A)</text><rect x="770" y="275" width="190" height="65" rx="18" fill="#16a34a18" stroke="#16a34a" stroke-width="3"/><text x="865.0" y="313" font-family="Inter,Arial,sans-serif" font-size="23" font-weight="500" text-anchor="middle" fill="#172033">not B</text><line x1="560" y1="525" x2="770" y2="435" stroke="#0891b2" stroke-width="4"/><text x="660" y="473.0" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="500" text-anchor="middle" fill="#0891b2">P(B|not A)</text><rect x="770" y="405" width="190" height="65" rx="18" fill="#16a34a18" stroke="#16a34a" stroke-width="3"/><text x="865.0" y="443" font-family="Inter,Arial,sans-serif" font-size="23" font-weight="500" text-anchor="middle" fill="#172033">B</text><line x1="560" y1="525" x2="770" y2="615" stroke="#0891b2" stroke-width="4"/><text x="660" y="563.0" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="500" text-anchor="middle" fill="#0891b2">1-P(B|not A)</text><rect x="770" y="585" width="190" height="65" rx="18" fill="#16a34a18" stroke="#16a34a" stroke-width="3"/><text x="865.0" y="623" font-family="Inter,Arial,sans-serif" font-size="23" font-weight="500" text-anchor="middle" fill="#172033">not B</text><text x="1060" y="164" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="500" text-anchor="middle" fill="#172033">P(A and B)</text><text x="1060" y="194" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="400" text-anchor="middle" fill="#64748b">= P(A)P(B|A)</text><line x1="960" y1="128" x2="1010" y2="164" stroke="#16a34a" stroke-width="3"/></svg>
