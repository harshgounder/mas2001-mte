<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">MAS2001 study roadmap</title><desc id="desc">Seven-stage study sequence from prerequisites to timed mock</desc><rect width="1200" height="720" fill="#ffffff"/><text x="60" y="58" font-family="Inter,Arial,sans-serif" font-size="34" font-weight="500" text-anchor="start" fill="#172033">Study order with dependency gates</text><circle cx="128" cy="147" r="34" fill="#dc2626"/><text x="128" y="155" font-family="Inter,Arial,sans-serif" font-size="24" font-weight="500" text-anchor="middle" fill="#ffffff">0</text><rect x="172" y="105" width="175" height="84" rx="18" fill="#dc262618" stroke="#dc2626" stroke-width="3"/><text x="259.5" y="143" font-family="Inter,Arial,sans-serif" font-size="23" font-weight="500" text-anchor="middle" fill="#172033">Prerequisites</text><text x="259.5" y="173" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="middle" fill="#64748b">Chebyshev, indep.</text><line x1="347" y1="147" x2="365" y2="147" stroke="#dbe3ee" stroke-width="3"/><circle cx="403" cy="147" r="34" fill="#2563eb"/><text x="403" y="155" font-family="Inter,Arial,sans-serif" font-size="24" font-weight="500" text-anchor="middle" fill="#ffffff">1</text><rect x="447" y="105" width="175" height="84" rx="18" fill="#2563eb18" stroke="#2563eb" stroke-width="3"/><text x="534.5" y="143" font-family="Inter,Arial,sans-serif" font-size="23" font-weight="500" text-anchor="middle" fill="#172033">Foundations</text><text x="534.5" y="173" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="middle" fill="#64748b">counting, conditional</text><line x1="622" y1="147" x2="640" y2="147" stroke="#dbe3ee" stroke-width="3"/><circle cx="678" cy="147" r="34" fill="#0891b2"/><text x="678" y="155" font-family="Inter,Arial,sans-serif" font-size="24" font-weight="500" text-anchor="middle" fill="#ffffff">2</text><rect x="722" y="105" width="175" height="84" rx="18" fill="#0891b218" stroke="#0891b2" stroke-width="3"/><text x="809.5" y="143" font-family="Inter,Arial,sans-serif" font-size="23" font-weight="500" text-anchor="middle" fill="#172033">Random vars</text><text x="809.5" y="173" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="middle" fill="#64748b">pmf, cdf, moments</text><line x1="897" y1="147" x2="915" y2="147" stroke="#dbe3ee" stroke-width="3"/><circle cx="953" cy="147" r="34" fill="#ea580c"/><text x="953" y="155" font-family="Inter,Arial,sans-serif" font-size="24" font-weight="500" text-anchor="middle" fill="#ffffff">3</text><rect x="997" y="105" width="175" height="84" rx="18" fill="#ea580c18" stroke="#ea580c" stroke-width="3"/><text x="1084.5" y="143" font-family="Inter,Arial,sans-serif" font-size="23" font-weight="500" text-anchor="middle" fill="#172033">Distributions</text><text x="1084.5" y="173" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="middle" fill="#64748b">five-model shelf</text><line x1="1172" y1="147" x2="1115" y2="147" stroke="#dbe3ee" stroke-width="3"/><line x1="1115" y1="147" x2="1115" y2="392" stroke="#dbe3ee" stroke-width="3"/><line x1="1115" y1="392" x2="90" y2="392" stroke="#dbe3ee" stroke-width="3"/><circle cx="128" cy="392" r="34" fill="#16a34a"/><text x="128" y="400" font-family="Inter,Arial,sans-serif" font-size="24" font-weight="500" text-anchor="middle" fill="#ffffff">4</text><rect x="172" y="350" width="175" height="84" rx="18" fill="#16a34a18" stroke="#16a34a" stroke-width="3"/><text x="259.5" y="388" font-family="Inter,Arial,sans-serif" font-size="23" font-weight="500" text-anchor="middle" fill="#172033">Sampling + CLT</text><text x="259.5" y="418" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="middle" fill="#64748b">SE, averages</text><line x1="347" y1="392" x2="365" y2="392" stroke="#dbe3ee" stroke-width="3"/><circle cx="403" cy="392" r="34" fill="#