<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">MAS2001 MTE concept map</title><desc id="desc">Prerequisite map from foundations to sampling and estimation</desc><rect width="1200" height="720" fill="#ffffff"/><text x="60" y="62" font-family="Inter,Arial,sans-serif" font-size="34" font-weight="500" text-anchor="start" fill="#172033">MAS2001 MTE concept map</text><rect x="455" y="95" width="290" height="86" rx="18" fill="#2563eb18" stroke="#2563eb" stroke-width="3"/><text x="600.0" y="133" font-family="Inter,Arial,sans-serif" font-size="23" font-weight="500" text-anchor="middle" fill="#172033">Probability foundations</text><text x="600.0" y="163" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="middle" fill="#64748b">sample spaces, counting, rules</text><rect x="70" y="260" width="220" height="90" rx="18" fill="#0891b218" stroke="#0891b2" stroke-width="3"/><text x="180.0" y="298" font-family="Inter,Arial,sans-serif" font-size="23" font-weight="500" text-anchor="middle" fill="#172033">Random variables</text><text x="180.0" y="328" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="middle" fill="#64748b">pmf, pdf, cdf</text><rect x="350" y="260" width="220" height="90" rx="18" fill="#7c3aed18" stroke="#7c3aed" stroke-width="3"/><text x="460.0" y="298" font-family="Inter,Arial,sans-serif" font-size="23" font-weight="500" text-anchor="middle" fill="#172033">Expectation</text><text x="460.0" y="328" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="middle" fill="#64748b">mean, variance, transforms</text><rect x="630" y="260" width="220" height="90" rx="18" fill="#ea580c18" stroke="#ea580c" stroke-width="3"/><text x="740.0" y="298" font-family="Inter,Arial,sans-serif" font-size="23" font-weight="500" text-anchor="middle" fill="#172033">Distributions</text><text x="740.0" y="328" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="middle" fill="#64748b">B, Poi, U, N, Exp</text><rect x="910" y="260" width="220" height="90" rx="18" fill="#dc262618" stroke="#dc2626" stroke-width="3"/><text x="1020.0" y="298" font-family="Inter,Arial,sans-serif" font-size="23" font-weight="500" text-anchor="middle" fill="#172033">Bounds</text><text x="1020.0" y="328" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="middle" fill="#64748b">Chebyshev</text><rect x="230" y="470" width="220" height="90" rx="18" fill="#16a34a18" stroke="#16a34a" stroke-width="3"/><text x="340.0" y="508" font-family="Inter,Arial,sans-serif" font-size="23" font-weight="500" text-anchor="middle" fill="#172033">Sampling</text><text x="340.0" y="538" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="middle" fill="#64748b">SE and CLT</text><rect x="690" y="470" width="220" height="90" rx="18" fill="#2563eb18" stroke="#2563eb" stroke-width="3"/><text x="800.0" y="508" font-family="Inter,Arial,sans-serif" font-size="23" font-weight="500" text-anchor="middle" fill="#172033">Estimation</text><text x="800.0" y="538" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="middle" fill="#64748b">bias, consistency, efficiency</text><line x1="600" y1="181" x2="180" y2="260" stroke="#dbe3ee" stroke-width="4"/><line x1="600" y1="181" x2="460" y2="260" stroke="#dbe3ee" stroke-width="4"/><line x1="600" y1="181" x2="740" y2="260" stroke="#dbe3ee" stroke-width="4"/><line x1="600" y1="181" x2="1020" y2="260" stroke="#dbe3ee" stroke-width="4"/><line x1="460" y1="350" x2="340" y2="470" stroke="#dbe3ee" stroke-width="4"/><line x1="740" y1="350" x2="800" y2="470" stroke="#dbe3ee" stroke-width="4"/><text x="600" y="650" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="400" text-anchor="middle" fill="#64748b">Overview only. Read connectors as prerequisites, not as claims of independence.</text></svg>
