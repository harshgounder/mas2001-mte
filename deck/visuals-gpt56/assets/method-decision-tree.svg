<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">Question-solving decision path</title><desc id="desc">Identify, choose, solve, and check workflow with model branches</desc><rect width="1200" height="720" fill="#ffffff"/><text x="60" y="58" font-family="Inter,Arial,sans-serif" font-size="34" font-weight="500" text-anchor="start" fill="#172033">Question-solving decision path</text><rect x="50" y="105" width="220" height="78" rx="18" fill="#2563eb18" stroke="#2563eb" stroke-width="3"/><text x="160.0" y="143" font-family="Inter,Arial,sans-serif" font-size="23" font-weight="500" text-anchor="middle" fill="#172033">1. Identify</text><text x="160.0" y="173" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="middle" fill="#64748b">named model or event?</text><line x1="270" y1="144" x2="345" y2="144" stroke="#dbe3ee" stroke-width="5"/><rect x="345" y="105" width="250" height="78" rx="18" fill="#0891b218" stroke="#0891b2" stroke-width="3"/><text x="470.0" y="143" font-family="Inter,Arial,sans-serif" font-size="23" font-weight="500" text-anchor="middle" fill="#172033">2. Choose form</text><text x="470.0" y="173" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="middle" fill="#64748b">pmf, pdf, CDF, tree</text><line x1="595" y1="144" x2="670" y2="144" stroke="#dbe3ee" stroke-width="5"/><rect x="670" y="105" width="220" height="78" rx="18" fill="#7c3aed18" stroke="#7c3aed" stroke-width="3"/><text x="780.0" y="143" font-family="Inter,Arial,sans-serif" font-size="23" font-weight="500" text-anchor="middle" fill="#172033">3. Solve</text><text x="780.0" y="173" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="middle" fill="#64748b">formula or algebra</text><line x1="890" y1="144" x2="965" y2="144" stroke="#dbe3ee" stroke-width="5"/><rect x="965" y="105" width="185" height="78" rx="18" fill="#16a34a18" stroke="#16a34a" stroke-width="3"/><text x="1057.5" y="143" font-family="Inter,Arial,sans-serif" font-size="23" font-weight="500" text-anchor="middle" fill="#172033">4. Check</text><text x="1057.5" y="173" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="middle" fill="#64748b">three loops</text><rect x="70" y="270" width="220" height="88" rx="18" fill="#ea580c18" stroke="#ea580c" stroke-width="3"/><text x="180.0" y="308" font-family="Inter,Arial,sans-serif" font-size="23" font-weight="500" text-anchor="middle" fill="#172033">Discrete</text><text x="180.0" y="338" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="middle" fill="#64748b">Binomial or Poisson</text><text x="180" y="400" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="500" text-anchor="middle" fill="#64748b">point, tail, interval</text><rect x="350" y="270" width="220" height="88" rx="18" fill="#ea580c18" stroke="#ea580c" stroke-width="3"/><text x="460.0" y="308" font-family="Inter,Arial,sans-serif" font-size="23" font-weight="500" text-anchor="middle" fill="#172033">Continuous</text><text x="460.0" y="338" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="middle" fill="#64748b">Uniform, Normal, Exp</text><text x="460" y="400" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="500" text-anchor="middle" fill="#64748b">area, standardise</text><rect x="630" y="270" width="220" height="88" rx="18" fill="#ea580c18" stroke="#ea580c" stroke-width="3"/><text x="740.0" y="308" font-family="Inter,Arial,sans-serif" font-size="23" font-weight="500" text-anchor="middle" fill="#172033">Event</text><text x="740.0" y="338" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="middle" fill="#64748b">count or condition</text><text x="740" y="400" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="500" text-anchor="middle" fill="#64748b">sets, tree, complement</text><rect x="910" y="270" width="220" height="88" rx="18" fill="#ea580c18" stroke="#ea580c" stroke-width="3"/><text x="1020.0" y="308" font-family="Inter,Arial,sans-serif" font-size="23" font-weight="500" text-anchor="middle" fill="#172033">Estimator</text><text x="1020.0" y="338" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="middle" fill="#64748b">bias before variance</text><text x="1020" y="400" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="500" text-anchor="middle" fill="#64748b">name the winner</text><rect x="135" y="520" width="280" height="90" rx="18" fill="#dc262618" stroke="#dc2626" stroke-width="3"/><text x="275.0" y="558" font-family="Inter,Arial,sans-serif" font-size="23" font-weight="500" text-anchor="middle" fill="#172033">SUPPORT</text><text x="275.0" y="588" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="middle" fill="#64748b">inside the allowed range</text><rect x="460" y="520" width="280" height="90" rx="18" fill="#ea580c18" stroke="#ea580c" stroke-width="3"/><text x="600.0" y="558" font-family="Inter,Arial,sans-serif" font-size="23" font-weight="500" text-anchor="middle" fill="#172033">BOUNDARY</text><text x="600.0" y="588" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="middle" fill="#64748b">at least versus more than</text><rect x="785" y="520" width="280" height="90" rx="18" fill="#16a34a18" stroke="#16a34a" stroke-width="3"/><text x="925.0" y="558" font-family="Inter,Arial,sans-serif" font-size="23" font-weight="500" text-anchor="middle" fill="#172033">SANITY</text><text x="925.0" y="588" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="middle" fill="#64748b">P in [0,1], variance ≥ 0</text><text x="600" y="675" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="500" text-anchor="middle" fill="#64748b">keep exact values until the final line</text></svg>
