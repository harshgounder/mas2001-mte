<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">Estimator comparison workflow</title><desc id="desc">Decision flow and variance bars for three estimators</desc><rect width="1200" height="720" fill="#ffffff"/><text x="60" y="58" font-family="Inter,Arial,sans-serif" font-size="34" font-weight="500" text-anchor="start" fill="#172033">Estimator set 2: all unbiased, compare variance</text><rect x="430" y="95" width="340" height="78" rx="18" fill="#2563eb18" stroke="#2563eb" stroke-width="3"/><text x="600.0" y="133" font-family="Inter,Arial,sans-serif" font-size="23" font-weight="500" text-anchor="middle" fill="#172033">T1, T2, and T3</text><text x="600.0" y="163" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="middle" fill="#64748b">compute each expectation</text><line x1="600" y1="173" x2="600" y2="235" stroke="#dbe3ee" stroke-width="4"/><rect x="430" y="235" width="340" height="88" rx="18" fill="#16a34a18" stroke="#16a34a" stroke-width="3"/><text x="600.0" y="273" font-family="Inter,Arial,sans-serif" font-size="23" font-weight="500" text-anchor="middle" fill="#172033">All are unbiased</text><text x="600.0" y="303" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="middle" fill="#64748b">choose the smallest variance</text><text x="150" y="437" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="500" text-anchor="end" fill="#172033">T3</text><rect x="175" y="410" width="71.3705122852389" height="38" fill="#16a34a" opacity="0.82"/><text x="261.3705122852389" y="437" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#172033">0.333 sigma^2</text><text x="150" y="509" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="500" text-anchor="end" fill="#172033">T1</text><rect x="175" y="482" width="210.26374049783533" height="38" fill="#0891b2" opacity="0.82"/><text x="400.26374049783533" y="509" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#172033">3 sigma^2</text><text x="150" y="581" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="500" text-anchor="end" fill="#172033">T2</text><rect x="175" y="554" width="465.0" height="38" fill="#7c3aed" opacity="0.82"/><text x="655.0" y="581" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#172033">29 sigma^2</text><text x="600" y="665" font-family="Inter,Arial,sans-serif" font-size="21" font-weight="500" text-anchor="middle" fill="#64748b">Consistency needs a sequence T_n as n grows; fixed n=3 cannot prove it.</text></svg>
