<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">Expectation and variance</title><desc id="desc">Probability balance point and two distributions with the same mean but different variance</desc><rect width="1200" height="720" fill="#ffffff"/><text x="60" y="58" font-family="Inter,Arial,sans-serif" font-size="34" font-weight="500" text-anchor="start" fill="#172033">Mean is the balance point; variance is squared spread</text><line x1="120" y1="265" x2="550" y2="265" stroke="#172033" stroke-width="5"/><circle cx="120" cy="265" r="10" fill="#2563eb"/><rect x="102" y="239.0" width="36" height="26.0" fill="#0891b2"/><text x="120" y="300" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="500" text-anchor="middle" fill="#172033">1</text><circle cx="227" cy="265" r="10" fill="#2563eb"/><rect x="209" y="213.0" width="36" height="52.0" fill="#0891b2"/><text x="227" y="300" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="500" text-anchor="middle" fill="#172033">2</text><circle cx="334" cy="265" r="10" fill="#2563eb"/><rect x="316" y="161.0" width="36" height="104.0" fill="#0891b2"/><text x="334" y="300" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="500" text-anchor="middle" fill="#172033">3</text><circle cx="441" cy="265" r="10" fill="#2563eb"/><rect x="423" y="213.0" width="36" height="52.0" fill="#0891b2"/><text x="441" y="300" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="500" text-anchor="middle" fill="#172033">4</text><circle cx="548" cy="265" r="10" fill="#2563eb"/><rect x="530" y="239.0" width="36" height="26.0" fill="#0891b2"/><text x="548" y="300" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="500" text-anchor="middle" fill="#172033">5</text><line x1="334" y1="105" x2="334" y2="280" stroke="#dc2626" stroke-width="3" stroke-dasharray="8 6"/><text x="334" y="95" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="500" text-anchor="middle" fill="#dc2626">E(X) = 3</text><text x="335" y="330" font-family="Inter,Arial,sans-serif" font-size="19" font-weight="400" text-anchor="middle" fill="#64748b">probability weights balance at the mean</text><text x="720" y="135" font-family="Inter,Arial,sans-serif" font-size="21" font-weight="500" text-anchor="middle" fill="#172033">small variance</text><line x1="600" y1="265" x2="840" y2="265" stroke="#172033" stroke-width="3"/><rect x="652" y="223.0" width="32" height="42.0" fill="#16a34a"/><rect x="704" y="139.0" width="32" height="126.0" fill="#16a34a"/><rect x="756" y="223.0" width="32" height="42.0" fill="#16a34a"/><text x="720" y="300" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="500" text-anchor="middle" fill="#64748b">same mean</text><text x="980" y="135" font-family="Inter,Arial,sans-serif" font-size="21" font-weight="500" text-anchor="middle" fill="#172033">large variance</text><line x1="860" y1="265" x2="1100" y2="265" stroke="#172033" stroke-width="3"/><rect x="860" y="223.0" width="32" height="42.0" fill="#7c3aed"/><rect x="964" y="139.0" width="32" height="126.0" fill="#7c3aed"/><rect x="1068" y="223.0" width="32" height="42.0" fill="#7c3aed"/><text x="980" y="300" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="500" text-anchor="middle" fill="#64748b">same mean</text><rect x="150" y="455" width="400" height="105" rx="18" fill="#2563eb18" stroke="#2563eb" stroke-width="3"/><text x="350.0" y="493" font-family="Inter,Arial,sans-serif" font-size="23" font-weight="500" text-anchor="middle" fill="#172033">Expectation</text><text x="350.0" y="523" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="middle" fill="#64748b">E[h(X)] = sum or integral of h(x) times weight</text><rect x="650" y="455" width="400" height="105" rx="18" fill="#7c3aed18" stroke="#7c3aed" stroke-width="3"/><text x="850.0" y="493" font-family="Inter,Arial,sans-serif" font-size="23" font-weight="500" text-anchor="middle" fill="#172033">Variance</text><text x="850.0" y="523" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="middle" fill="#64748b">Var(X) = E(X²) - [E(X)]²</text><text x="600" y="650" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="500" text-anchor="middle" fill="#172033">shifts preserve variance; multiplying by a scales variance by a²</text></svg>
