<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">MAS2001 formula landscape</title><desc id="desc">Four-part map for choosing the correct probability or statistics formula</desc><rect width="1200" height="720" fill="#ffffff"/><text x="60" y="58" font-family="Inter,Arial,sans-serif" font-size="34" font-weight="500" text-anchor="start" fill="#172033">Formula landscape: classify first, then compute</text><rect x="455" y="88" width="290" height="76" rx="18" fill="#2563eb18" stroke="#2563eb" stroke-width="3"/><text x="600.0" y="126" font-family="Inter,Arial,sans-serif" font-size="23" font-weight="500" text-anchor="middle" fill="#172033">Read the ask</text><text x="600.0" y="156" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="middle" fill="#64748b">name the object and target</text><line x1="600" y1="164" x2="305" y2="220" stroke="#dbe3ee" stroke-width="4"/><rect x="65" y="220" width="480" height="92" rx="18" fill="#0891b218" stroke="#0891b2" stroke-width="3"/><text x="305.0" y="258" font-family="Inter,Arial,sans-serif" font-size="23" font-weight="500" text-anchor="middle" fill="#172033">Probability</text><text x="305.0" y="288" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="middle" fill="#64748b">P(A|B), counting, independence</text><line x1="600" y1="164" x2="865" y2="220" stroke="#dbe3ee" stroke-width="4"/><rect x="625" y="220" width="480" height="92" rx="18" fill="#7c3aed18" stroke="#7c3aed" stroke-width="3"/><text x="865.0" y="258" font-family="Inter,Arial,sans-serif" font-size="23" font-weight="500" text-anchor="middle" fill="#172033">Random variables</text><text x="865.0" y="288" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="middle" fill="#64748b">pmf, pdf, CDF, E(X), Var(X)</text><line x1="600" y1="164" x2="305" y2="410" stroke="#dbe3ee" stroke-width="4"/><rect x="65" y="410" width="480" height="92" rx="18" fill="#ea580c18" stroke="#ea580c" stroke-width="3"/><text x="305.0" y="448" font-family="Inter,Arial,sans-serif" font-size="23" font-weight="500" text-anchor="middle" fill="#172033">Five distributions</text><text x="305.0" y="478" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="middle" fill="#64748b">B, Poi, U, N, Exp</text><line x1="600" y1="164" x2="865" y2="410" stroke="#dbe3ee" stroke-width="4"/><rect x="625" y="410" width="480" height="92" rx="18" fill="#16a34a18" stroke="#16a34a" stroke-width="3"/><text x="865.0" y="448" font-family="Inter,Arial,sans-serif" font-size="23" font-weight="500" text-anchor="middle" fill="#172033">Bounds and inference</text><text x="865.0" y="478" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="middle" fill="#64748b">Chebyshev, SE, CLT, estimators</text><rect x="160" y="590" width="180" height="64" rx="18" fill="#2563eb18" stroke="#2563eb" stroke-width="3"/><text x="250.0" y="628" font-family="Inter,Arial,sans-serif" font-size="23" font-weight="500" text-anchor="middle" fill="#172033">support</text><rect x="380" y="590" width="180" height="64" rx="18" fill="#2563eb18" stroke="#2563eb" stroke-width="3"/><text x="470.0" y="628" font-family="Inter,Arial,sans-serif" font-size="23" font-weight="500" text-anchor="middle" fill="#172033">boundary</text><rect x="600" y="590" width="180" height="64" rx="18" fill="#2563eb18" stroke="#2563eb" stroke-width="3"/><text x="690.0" y="628" font-family="Inter,Arial,sans-serif" font-size="23" font-weight="500" text-anchor="middle" fill="#172033">units</text><rect x="820" y="590" width="180" height="64" rx="18" fill="#2563eb18" stroke="#2563eb" stroke-width="3"/><text x="910.0" y="628" font-family="Inter,Arial,sans-serif" font-size="23" font-weight="500" text-anchor="middle" fill="#172033">exact value</text><text x="600" y="690" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="500" text-anchor="middle" fill="#64748b">final gate: support, boundary word, units, and exact value</text></svg>
